    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f8f9fa;
        }
        .header-container {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .graph-title {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
        }
        .back-link-btn {
            font-size: 14px;
            font-weight: bold;
            color: #2196F3;
            background-color: #e3f2fd;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            border: 1px solid #90caf9;
            transition: all 0.2s ease;
        }
        .back-link-btn:hover {
            background-color: #2196F3;
            color: white;
            border-color: #2196F3;
            box-shadow: 0 2px 5px rgba(33,150,243,0.3);
        }
        .chart-card {
            background: white;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }
        .chart-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .chart-header {
            font-size: 20px;
            font-weight: bold;
            color: #1e293b;
        }
        .legend-box-container {
            display: flex;
            gap: 16px;
            align-items: center;
            background: #f8fafc;
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: bold;
            color: #334155;
        }
        .legend-color-box {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }
        .axis text {
            font-size: 13px;
        }
        .axis path, .axis line {
            stroke: #cbd5e1;
        }
        .grid line {
            stroke: #f1f5f9;
        }
        .tooltip {
            position: absolute;
            padding: 10px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            border-radius: 4px;
            font-size: 13px;
            pointer-events: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .source-date-footer {
            font-size: 13px;
            color: #64748b;
            margin-top: 10px;
            font-weight: 500;
        }
    </style>
</head>

    <div class="header-container">

        // Parse data
        const awards = jsonData.map(d => {
            const startDate = new Date(d['Project Start Date']);
            const fain = String(d['FAIN'] || '').trim();
            const rawAmt = d['Award Amount'];
            const amount = typeof rawAmt === 'number' ? rawAmt : (parseFloat(rawAmt) || 0.0);

            // Find closeout amendment date
            const amends = amendmentData[fain] || [];
            let closeoutDate = null;
            const closeoutAmend = amends.find(a => {
                if (!a || !a.date) return false;
                const typeStr = a.type ? String(a.type).trim().toLowerCase() : "";
                return typeStr.includes('closeout') || typeStr.includes('grant closeout');
            });
            if (closeoutAmend) {
                const cDate = new Date(closeoutAmend.date);
                if (!isNaN(cDate.getTime())) closeoutDate = cDate;
            }

            return {
                FAIN: fain,
                startDate: startDate,
                closeoutDate: closeoutDate,
                amount: amount,
                startYear: startDate && !isNaN(startDate.getTime()) ? startDate.getFullYear() : null,
                closeYear: closeoutDate ? closeoutDate.getFullYear() : null
            };
        }).filter(d => d.startYear !== null);

        // Cap chart timeline at current year
        const currentYear = new Date().getFullYear();
        const startYears = awards.map(d => d.startYear);
        const minYear = d3.min(startYears) || 2014;
        const maxYear = currentYear;

        // Build Yearly Cumulative Summary up to Current Year
        const yearlyData = [];
        for (let yr = minYear; yr <= maxYear; yr++) {
            let totalCount = 0;
            let closedCount = 0;
            let activeCount = 0;

            let totalFunding = 0;
            let closedFunding = 0;
            let activeFunding = 0;

            awards.forEach(d => {
                if (d.startYear <= yr) {
                    totalCount += 1;
                    totalFunding += d.amount;

                    if (d.closeYear !== null && d.closeYear <= yr) {
                        closedCount += 1;
                        closedFunding += d.amount;
                    } else {
                        activeCount += 1;
                        activeFunding += d.amount;
                    }
                }
            });

            yearlyData.push({
                year: yr,
                totalCount: totalCount,
                closedCount: closedCount,
                activeCount: activeCount,
                totalFunding: totalFunding,
                closedFunding: closedFunding,
                activeFunding: activeFunding
            });
        }

        const margin = {top: 20, right: 30, bottom: 40, left: 90};
        const width = 1200 - margin.left - margin.right;
        const height = 360 - margin.top - margin.bottom;

        const formatCurrency = d3.format("$,.0f");

        // -------------------------------------------------------------
        // RENDER CHART 1: Cumulative Award Counts
        // -------------------------------------------------------------
        (function renderCountChart() {
            const svg = d3.select("#countChart")
                .append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom)
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            const x = d3.scaleBand()
                .domain(yearlyData.map(d => d.year))
                .range([0, width])
                .padding(0.25);

            const y = d3.scaleLinear()
                .domain([0, d3.max(yearlyData, d => d.totalCount) * 1.08 || 220])
                .range([height, 0]);

            svg.append("g")
                .attr("class", "grid")
                .call(d3.axisLeft(y).tickSize(-width).tickFormat(""));

            svg.append("g")
                .attr("class", "axis")
                .attr("transform", `translate(0,${height})`)
                .call(d3.axisBottom(x));

            svg.append("g")
                .attr("class", "axis")
                .call(d3.axisLeft(y).ticks(8));

            const groups = svg.selectAll(".year-group")
                .data(yearlyData)
                .enter()
                .append("g")
                .attr("transform", d => `translate(${x(d.year)},0)`);

            // Closed portion (Orange) - Placed at the BOTTOM
            groups.append("rect")
                .attr("x", 0)
                .attr("y", d => y(d.closedCount))
                .attr("width", x.bandwidth())
                .attr("height", d => height - y(d.closedCount))
                .attr("fill", "#ff9800");

            // Active portion (Blue) - Stacked on TOP
            groups.append("rect")
                .attr("x", 0)
                .attr("y", d => y(d.totalCount))
                .attr("width", x.bandwidth())
                .attr("height", d => y(d.closedCount) - y(d.totalCount))
                .attr("fill", "rgb(30, 144, 255)");

            // Invisible overlay rect for tooltips
            groups.append("rect")
                .attr("x", 0)
                .attr("y", 0)
                .attr("width", x.bandwidth())
                .attr("height", height)
                .attr("fill", "transparent")
                .style("cursor", "pointer")
                .on("mouseover", function(event, d) {
                    const tooltip = d3.select("body").append("div").attr("class", "tooltip").style("opacity", 0);
                    tooltip.transition().duration(150).style("opacity", .95);
                    tooltip.html(`<b>Year ${d.year}</b><br>` +
                                 `Total Cumulative Awards: <b>${d.totalCount}</b><br>` +
                                 `Closed Out Portion: ${d.closedCount}<br>` +
                                 `Active Portion: ${d.activeCount}`)
                           .style("left", (event.pageX + 12) + "px")
                           .style("top", (event.pageY - 28) + "px");
                })
                .on("mouseout", function() {
                    d3.selectAll(".tooltip").remove();
                });
        })();

        // -------------------------------------------------------------
        // RENDER CHART 2: Cumulative Funding Amount
        // -------------------------------------------------------------
        (function renderFundingChart() {
            const svg = d3.select("#fundingChart")
                .append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom)
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            const x = d3.scaleBand()
                .domain(yearlyData.map(d => d.year))
                .range([0, width])
                .padding(0.25);

            const y = d3.scaleLinear()
                .domain([0, d3.max(yearlyData, d => d.totalFunding) * 1.08 || 1500000000])
                .range([height, 0]);

            svg.append("g")
                .attr("class", "grid")
                .call(d3.axisLeft(y).tickSize(-width).tickFormat(""));

            svg.append("g")
                .attr("class", "axis")
                .attr("transform", `translate(0,${height})`)
                .call(d3.axisBottom(x));

            svg.append("g")
                .attr("class", "axis")
                .call(d3.axisLeft(y).ticks(8).tickFormat(d => "$" + d3.format(".2s")(d).replace("G", "B")));

            const groups = svg.selectAll(".year-group")
                .data(yearlyData)
                .enter()
                .append("g")
                .attr("transform", d => `translate(${x(d.year)},0)`);

            // Closed Funding portion (Orange) - Placed at the BOTTOM
            groups.append("rect")
                .attr("x", 0)
                .attr("y", d => y(d.closedFunding))
                .attr("width", x.bandwidth())
                .attr("height", d => height - y(d.closedFunding))
                .attr("fill", "#ff9800");

            // Active Funding portion (Blue) - Stacked on TOP
            groups.append("rect")
                .attr("x", 0)
                .attr("y", d => y(d.totalFunding))
                .attr("width", x.bandwidth())
                .attr("height", d => y(d.closedFunding) - y(d.totalFunding))
                .attr("fill", "rgb(30, 144, 255)");

            // Invisible overlay rect for tooltips
            groups.append("rect")
                .attr("x", 0)
                .attr("y", 0)
                .attr("width", x.bandwidth())
                .attr("height", height)
                .attr("fill", "transparent")
                .style("cursor", "pointer")
                .on("mouseover", function(event, d) {
                    const tooltip = d3.select("body").append("div").attr("class", "tooltip").style("opacity", 0);
                    tooltip.transition().duration(150).style("opacity", .95);
                    tooltip.html(`<b>Year ${d.year}</b><br>` +
                                 `Total Cumulative Funding: <b>${formatCurrency(d.totalFunding)}</b><br>` +
                                 `Amount of Closed Awards: ${formatCurrency(d.closedFunding)}<br>` +
                                 `Amount of Active Awards: ${formatCurrency(d.activeFunding)}`)
                           .style("left", (event.pageX + 12) + "px")
                           .style("top", (event.pageY - 28) + "px");
                })
                .on("mouseout", function() {
                    d3.selectAll(".tooltip").remove();
                });
        })();
    </script>
</body>
</html>
